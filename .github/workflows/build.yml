          )

      - name: M8 native C11 struct field differential
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          cp tests/fixtures/m8_struct_fields.c ../edgcpp/build/gcc-release/
          cp tests/fixtures/m8_struct_driver.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            ../../../edgcpp-rust/target/debug/examples/codegen edg_m8_struct.o --c11 m8_struct_fields.c
            gcc -std=c11 -O2 m8_struct_fields.c m8_struct_driver.c -o gcc_m8_struct
            gcc -std=c11 -O2 edg_m8_struct.o m8_struct_driver.c -o cranelift_m8_struct
            baseline=$(./gcc_m8_struct)
            generated=$(./cranelift_m8_struct)
            if [ "$baseline" != "$generated" ]; then
              echo "M8 EDG/Cranelift struct field mismatch"
              printf 'GCC: %s\n' "$baseline"
              printf 'EDG: %s\n' "$generated"
              exit 1
            fi
            echo "M8 native layout and field differential passed"
          )

      - name: Reject unsupported EDG constructs
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tests/fixtures/codegen_rejected.cpp ../edgcpp/build/gcc-release/
          cp tests/fixtures/m5_gnu_statement_expr.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            # The formerly rejected C++20 FP return is now supported.
            ../../../edgcpp-rust/target/debug/examples/codegen accepted_fp.o --c++20 -DTEST_FLOAT_RETURN codegen_rejected.cpp
            nm -g --defined-only accepted_fp.o | grep -Eq ' [Tt] rejected$'
            rm -f accepted_fp.o
            for variant in TEST_FLOAT_LOCAL; do
              rm -f rejected.o rejected.log
              if ../../../edgcpp-rust/target/debug/examples/codegen rejected.o --c++20 -D"$variant" codegen_rejected.cpp > rejected.log 2>&1; then
                echo "Unexpectedly accepted unsupported construct: $variant"
                exit 1
              fi
              grep -Eq 'parameter/return ABI must be|call callee is not a direct named routine|function-pointer calls unsupported|unsupported EDG operation|unsupported typed EDG expression|unsupported C expression type|unsupported/nonlocal variable|unresolved scalar variable|qualified global|FP locals require typed scalar CFG integration|unsupported FP source expression form|FP source statement|unsupported FP control flow or statement form|qualified/reference FP local needs memory effects|FP if arms must both return or contain assignment-only control flow' rejected.log || {
                echo "Wrong rejection reason for $variant"
                cat rejected.log
                exit 1
              }
              test ! -e rejected.o
              echo "Rejected $variant"
            done
            rm -f rejected.o rejected.log
            if ../../../edgcpp-rust/target/debug/examples/codegen rejected.o --c11 --gcc m5_gnu_statement_expr.c > rejected.log 2>&1; then
              echo "Unexpectedly accepted GNU statement expression without block/value lowering"
              exit 1
            fi
            grep -E 'GNU block has unsupported statement kind|GNU statement-expression missing|GNU block statements after result' rejected.log
            test ! -e rejected.o
          )

      - name: Save incremental Rust cache (successful codegen-branch builds only)
        if: ${{ success() && github.ref == 'refs/heads/cranelift-codegen' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            edgcpp-rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
