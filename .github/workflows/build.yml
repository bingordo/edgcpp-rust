name: Rust EDG bridge (Linux x86-64)

# Only the default branch is verified on push. Pull requests get their own
# verification, avoiding duplicate push + PR builds on feature branches.
# Documentation-only updates do not compile C++/Rust.
on:
  push:
    branches: [cranelift-codegen]
    paths-ignore:
      - README.md
      - docs/**
      - '**/*.md'
      # A separate small workflow validates YARPGen harness edits.
      - tools/yarpgen_smoke.py
      - tests/test_yarpgen_smoke.py
      - .github/workflows/yarpgen-smoke.yml
  pull_request:
    branches: [cranelift-codegen]
    paths-ignore:
      - README.md
      - docs/**
      - '**/*.md'
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch before they consume build CPU.
concurrency:
  group: edgcpp-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # Identical native toolchain to the published EDG x86-64 archive.
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      # The versioned GitHub Release is built from exactly this EDG source.
      EDG_SOURCE_SHA: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
      EDG_RELEASE_TAG: edgcpfe-ci-799603e0b5ab
      # SHA-256 of the GitHub Release asset, independent of BUILD-INFO.txt.
      EDG_RELEASE_SHA256: fa769825e70766fbefe017806816b2338acd03daa93bb5562369c293972ce64c
      # CI needs failures and diagnostics but not bulky debug symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_TOOLCHAIN_VERSION: 1.99.1

    steps:
      - name: Check out Rust bindings
        uses: actions/checkout@v7
        with:
          path: edgcpp-rust

      - name: Check out exact EDG headers/configuration sources
        uses: actions/checkout@v7
        with:
          repository: bingundu/edgcpp
          ref: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
          path: edgcpp
          persist-credentials: false

      - name: Verify checkout matches the pinned EDG binary
        working-directory: edgcpp
        run: |
          test "$(git rev-parse HEAD)" = "$EDG_SOURCE_SHA"

      # GitHub's cache entries are immutable, so restore the newest matching
      # prior cache; only new development-branch builds save a replacement snapshot.
      - name: Restore Rust/Cargo incremental compilation cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            edgcpp-rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-edgcpp-cranelift-v1-${{ env.EDG_SOURCE_SHA }}-rust${{ env.RUST_TOOLCHAIN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('edgcpp-rust/Cargo.toml', 'edgcpp-rust/Cargo.lock', 'edgcpp-rust/build.rs', 'edgcpp-rust/cpp/bridge.cpp', 'edgcpp-rust/tools/build_bridge.py') }}-${{ github.sha }}
          restore-keys: |
            rust-edgcpp-cranelift-v1-${{ env.EDG_SOURCE_SHA }}-rust${{ env.RUST_TOOLCHAIN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('edgcpp-rust/Cargo.toml', 'edgcpp-rust/Cargo.lock', 'edgcpp-rust/build.rs', 'edgcpp-rust/cpp/bridge.cpp', 'edgcpp-rust/tools/build_bridge.py') }}-
            rust-edgcpp-cranelift-v1-${{ env.EDG_SOURCE_SHA }}-rust${{ env.RUST_TOOLCHAIN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-

      # EDG's IL layout depends on compile-time macros. CMake configure is
      # cheap and generates matching compile_commands.json and environment.sh.
      # Do not build the native archive here; download its tested binary.
      - name: Configure metadata for EDG bridge compilation (no native build)
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        working-directory: edgcpp
        run: |
          cmake --preset linux-gcc-release \
            -DEDG_BUILD_LIB=OFF \
            -DEDG_BUILD_CALLABLE_LIBRARY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # EDG generates two error-message headers through a tiny host tool.
      # Building this named target does NOT build the EDG front-end library.
      - name: Generate EDG error headers (small host-tool target only)
        working-directory: edgcpp
        run: |
          cmake --build build/gcc-release --target error-info --parallel 2
          test -s build/gcc-release/src/includes/err_codes.h
          test -s build/gcc-release/src/includes/err_data.h

      - name: Download pinned, prebuilt EDG archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          url="https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-x86_64-callable-release-linux-x86_64.tar.gz"
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error \
            --retry 4 --retry-delay 2 \
            "$url" --output build/prebuilt-edg/archive.tar.gz
          printf '%s  %s\n' "$EDG_RELEASE_SHA256" build/prebuilt-edg/archive.tar.gz | sha256sum --check --status
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a
          echo "Using prebuilt EDG $EDG_SOURCE_SHA; no EDG native compilation"

      - name: Install pinned Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN_VERSION"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup component add clippy --toolchain "$RUST_TOOLCHAIN_VERSION"
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Build bindings and tests
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --lib --tests --features codegen
          cargo build --example parse
          cargo clippy --all-targets -- -D warnings
          cp tests/fixtures/namespaces.cpp ../edgcpp/build/gcc-release/il_fixture.cpp
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            # The full IL dump is needed only for a failing assertion.
            trap 'rc=$?; echo "IL fixture validation failed (status=$rc)"; if test -f il_result.txt; then tail -n 100 il_result.txt; fi; exit "$rc"' ERR
            ../../../edgcpp-rust/target/debug/examples/parse --c++20 il_fixture.cpp > il_result.txt
              grep -qF 'namespace outer' il_result.txt
            grep -qF 'variable outer::count' il_result.txt
            grep -qF 'routine outer::calculate, defined=true' il_result.txt
            grep -qF 'routine control_flow_verification::branching, defined=true' il_result.txt
            grep -qF 'routine control_flow_verification::ranged, defined=true' il_result.txt
            grep -qF 'routine control_flow_verification::exception_handling, defined=true' il_result.txt
            grep -qF 'statement control_flow_verification::branching path=' il_result.txt
            grep -qF 'statement attributes control_flow_verification::branching path=' il_result.txt
            grep -qE 'control expression control_flow_verification::branching statement=.*role=1 path=0 ' il_result.txt
            grep -qF 'variable outer::inner::nested' il_result.txt
            grep -qF 'statement outer::calculate path=' il_result.txt
            grep -qF 'expression outer::calculate statement=' il_result.txt
            grep -qF 'integer constant outer::calculate = 0' il_result.txt
            grep -qF 'type id=' il_result.txt
            grep -qF 'record field member offset=0 bit=0 width=0' il_result.txt
            grep -qE 'record field flags offset=[0-9]+ bit=[0-9]+ width=3' il_result.txt
            grep -qF 'reference=true rvalue=false' il_result.txt
            grep -qF 'reference=true rvalue=true' il_result.txt
            grep -qE 'function signature id=[0-9]+ prototyped=true variadic=true' il_result.txt
            # Declaration and initializer positions are distinct in lowered EDG.
            grep -qE 'statement declaration declaration_site_verification::mixed path=.* position=0 name=declaration_site_verification::first symbol=[0-9]+ type=[0-9]+ vla=false' il_result.txt
            grep -qE 'statement declaration declaration_site_verification::mixed path=.* position=1 name=declaration_site_verification::second symbol=[0-9]+ type=[0-9]+ vla=false' il_result.txt
            grep -qE 'statement initialization declaration_site_verification::mixed path=.* name=Some\("declaration_site_verification::first"\).*role=0 ' il_result.txt
            grep -qE 'statement initialization declaration_site_verification::mixed path=.* name=Some\("declaration_site_verification::second"\).*role=0 ' il_result.txt
            grep -qE 'control expression declaration_site_verification::mixed statement=.* role=4 path=0 parent=None ' il_result.txt
            grep -qE 'routine identity id=[0-9]+ function=declaration_site_verification::mixed' il_result.txt
            grep -qE 'object lifetime routine=declaration_site_verification::mixed id=0 parent=None kind=[0-9]+' il_result.txt
            grep -qE 'scope lifetime routine=declaration_site_verification::mixed scope=0 lifetime=0' il_result.txt
            grep -qE 'lifetime destruction routine=declaration_site_verification::mixed lifetime=[0-9]+ position=0 variable=Some\(SymbolId\([0-9]+\)\) destructor=Some\(SymbolId\([0-9]+\)\)' il_result.txt
            grep -qE 'statement source declaration_site_verification::mixed path=.*file=.*il_fixture.cpp line=[0-9]+ column=[0-9]+' il_result.txt
            grep -qE 'symbol source id=[0-9]+ name=declaration_site_verification::(first|second).*file=.*il_fixture.cpp line=[0-9]+' il_result.txt
            grep -qF 'routine outer::big_unsigned, defined=true' il_result.txt
            grep -qF 'routine outer::overloaded(int), defined=true' il_result.txt
            grep -qF 'routine outer::overloaded(long), defined=true' il_result.txt
            grep -qF 'indexed symbols=' il_result.txt
            grep -qE 'symbol type name=outer::count id=[0-9]+ type=[0-9]+' il_result.txt
            grep -qE 'symbol type name=.*Derived::method id=[0-9]+ type=[0-9]+' il_result.txt
            grep -qE 'function parameter routine=scope_verification::shadow.*position=Some\(0\).*type=[0-9]+ this=false' il_result.txt
            grep -qE 'function parameter routine=scope_verification::shadow.*position=Some\(1\).*type=[0-9]+ this=false' il_result.txt
            grep -qE 'function parameter routine=.*Receiver::read.*this=true' il_result.txt
            grep -qE 'local scope routine=scope_verification::shadow id=0 parent=None' il_result.txt
            grep -qE 'local variable routine=scope_verification::shadow scope=[0-9]+ name=.*value.*type=[0-9]+' il_result.txt
            grep -qE 'static local owner routine=scope_verification::shadow name=.*calls symbol=[0-9]+' il_result.txt
            grep -qE 'base class derived=[0-9]+ position=0 base=[0-9]+ virtual=false' il_result.txt
            grep -qE 'base class derived=[0-9]+ position=1 base=[0-9]+ virtual=true' il_result.txt
            grep -qE 'base access derived=[0-9]+ position=0 access=Some\([0-9]+\) pack=false' il_result.txt
            grep -qE 'base access derived=[0-9]+ position=1 access=Some\([0-9]+\) pack=false' il_result.txt
            grep -qE 'member function owner=[0-9]+ name=.*Derived::method' il_result.txt
            grep -qE 'member function owner=[0-9]+ name=.*Derived::static_method' il_result.txt
            grep -qE 'routine attributes name=.*Derived::virtual_method.*virtual=true override=true' il_result.txt
            # This EDG lowering configuration emits scalar member initializers
            # in the constructor body, not in constructor_inits. Validate the
            # resulting expression rather than requiring an optional event 23.
            grep -qF 'expression cpp_bridge_verification::InitializerExpressionProbe::InitializerExpressionProbe(int) statement=' il_result.txt
            grep -qE 'constructor initializer routine=.*Derived::Derived.*position=[0-9]+ kind=[0-3]' il_result.txt
            grep -qF 'variable outer::constant_answer' il_result.txt
            grep -qE 'initializer integer symbol=[0-9]+ value=42' il_result.txt
            grep -qF 'variable outer::initialized_from_count' il_result.txt
            grep -qE 'routine __sti_.*defined=true' il_result.txt
            grep -qE 'reference __sti_.* -> outer::initialized_from_count' il_result.txt
            grep -qF 'symbol reference ' il_result.txt
            grep -qF 'statement outer::overloaded(int) path=' il_result.txt
            grep -qF 'statement outer::overloaded(long) path=' il_result.txt
            # Unsigned i64 constants now preserve all bits, transported
            # as a signed i64 carrier with the EDG type kept separately.
            grep -qF 'integer constant outer::big_unsigned' il_result.txt
          )

      - name: Test optional Cranelift ELF backend (targeted)
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # Rust unit/integration tests already ran with codegen above.
          bash tools/m4_data_probe.sh
          # Compile the actual EDG global-lvalue translation unit and link it
          # against data owned by the GCC-built driver.
          cargo build --features codegen --example codegen
          cp tests/fixtures/m4_external_globals.c ../edgcpp/build/gcc-release/
          cp tests/fixtures/m4_external_driver.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            ../../../edgcpp-rust/target/debug/examples/codegen edg_m4.o --c11 m4_external_globals.c
            gcc -std=c11 -O2 m4_external_globals.c m4_external_driver.c -o gcc_m4
            gcc -std=c11 -O2 edg_m4.o m4_external_driver.c -o cranelift_m4
            ./gcc_m4 > gcc_m4.out
            ./cranelift_m4 > cranelift_m4.out
            if [ "$(cat gcc_m4.out)" != "$(cat cranelift_m4.out)" ]; then
              echo "EDG/GCC global-memory mismatch"
              echo "GCC:"; cat gcc_m4.out
              echo "EDG:"; cat cranelift_m4.out
              exit 1
            fi
          )
          # M4: storage owned by the generated object (data, BSS, local).
          cp tests/fixtures/m4_defined_globals.c ../edgcpp/build/gcc-release/
          cp tests/fixtures/m4_defined_driver.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            ../../../edgcpp-rust/target/debug/examples/codegen edg_m4_defined.o --c11 m4_defined_globals.c
            gcc -std=c11 -O2 m4_defined_globals.c m4_defined_driver.c -o gcc_m4_defined
            gcc -std=c11 -O2 edg_m4_defined.o m4_defined_driver.c -o cranelift_m4_defined
            gcc_result=$(./gcc_m4_defined)
            edg_result=$(./cranelift_m4_defined)
            if [ "$gcc_result" != "$edg_result" ]; then
              echo "M4 defined-global data/BSS mismatch"
              printf 'GCC: %s\nEDG: %s\n' "$gcc_result" "$edg_result"
              exit 1
            fi
          )

      - name: M5 pointer/array and address-taken local differential test
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          cp tests/fixtures/m5_pointer_arrays.c ../edgcpp/build/gcc-release/
          cp tests/fixtures/m5_pointer_driver.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            ../../../edgcpp-rust/target/debug/examples/codegen edg_m5.o --c11 m5_pointer_arrays.c
            gcc -std=c11 -O2 m5_pointer_arrays.c m5_pointer_driver.c -o gcc_m5
            gcc -std=c11 -O2 edg_m5.o m5_pointer_driver.c -o cranelift_m5
            reference=$(./gcc_m5)
            actual=$(./cranelift_m5)
            if [ "$reference" != "$actual" ]; then
              echo "M5 pointer/array mismatch"
              printf 'GCC: %s\nEDG: %s\n' "$reference" "$actual"
              exit 1
            fi
          )

      - name: M6 typed direct-call ELF and GCC interoperability
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          cp tests/fixtures/m6_calls.c ../edgcpp/build/gcc-release/
          cp tests/fixtures/m6_calls_driver.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            ../../../edgcpp-rust/target/debug/examples/codegen edg_m6.o --c11 m6_calls.c
            gcc -std=c11 -O2 m6_calls.c m6_calls_driver.c -o gcc_m6
            gcc -std=c11 -O2 edg_m6.o m6_calls_driver.c -o cranelift_m6
            reference=$(./gcc_m6)
            actual=$(./cranelift_m6)
            if [ "$reference" != "$actual" ]; then
              echo "M6 direct-call GCC mismatch"
              printf 'GCC: %s\nEDG: %s\n' "$reference" "$actual"
              exit 1
            fi
          )

      - name: M6 GNU block-value expression GCC differential
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          cp tests/fixtures/m6_gnu_blocks.c ../edgcpp/build/gcc-release/
          cp tests/fixtures/m6_gnu_driver.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            ../../../edgcpp-rust/target/debug/examples/codegen edg_m6_gnu.o --c11 --gcc m6_gnu_blocks.c
            gcc -std=gnu11 -O2 m6_gnu_blocks.c m6_gnu_driver.c -o gcc_m6_gnu
            gcc -std=gnu11 -O2 edg_m6_gnu.o m6_gnu_driver.c -o cranelift_m6_gnu
            reference=$(./gcc_m6_gnu)
            actual=$(./cranelift_m6_gnu)
            if [ "$reference" != "$actual" ]; then
              echo "M6 GNU block-value GCC mismatch"
              printf 'GCC: %s\nEDG: %s\n' "$reference" "$actual"
              exit 1
            fi
          )

      - name: M6 GNU statement-expression 35-case native differential
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          python3 tools/m6_gnu_differential.py --codegen "$PWD/target/debug/examples/codegen" --edg-environment "$PWD/../edgcpp/build/gcc-release/environment.sh" --codegen-cwd "$PWD/../edgcpp/build/gcc-release"

      - name: EDG to Cranelift vs GCC native execution
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --features codegen --example codegen
          cp tests/fixtures/codegen_simple.cpp ../edgcpp/build/gcc-release/
          cp tests/fixtures/codegen_reference_main.cpp ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            ../../../edgcpp-rust/target/debug/examples/codegen edg_reference.o --c++20 codegen_simple.cpp
            g++ -std=c++20 -O2 codegen_simple.cpp codegen_reference_main.cpp -o gcc_reference
            g++ -std=c++20 -O2 edg_reference.o codegen_reference_main.cpp -o cranelift_reference
            baseline=$(./gcc_reference)
            generated=$(./cranelift_reference)
            test "$baseline" = "$generated"
            printf 'EDG/Cranelift comparison passed: %s\\n' "$generated"
          )

      - name: EDG C11 scalar expressions vs GCC (targeted)
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          set -euo pipefail
          cp tests/fixtures/codegen_m3_c.c ../edgcpp/build/gcc-release/
          cp tests/fixtures/codegen_m3_c_main.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            ../../../edgcpp-rust/target/debug/examples/codegen edg_m3_c.o --c11 codegen_m3_c.c
            gcc -std=c11 -O2 codegen_m3_c.c codegen_m3_c_main.c -o gcc_m3_c
            gcc -std=c11 -O2 edg_m3_c.o codegen_m3_c_main.c -o cranelift_m3_c
            baseline=$(./gcc_m3_c)
            generated=$(./cranelift_m3_c)
            test "$baseline" = "$generated"
            printf '%s\n' "$generated"
          )

      - name: Reject unsupported EDG constructs
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
          EDGCPP_EDG_REVISION: ${{ env.EDG_SOURCE_SHA }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cp tests/fixtures/codegen_rejected.cpp ../edgcpp/build/gcc-release/
          cp tests/fixtures/m5_gnu_statement_expr.c ../edgcpp/build/gcc-release/
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            for variant in TEST_INDIRECT_CALL TEST_FLOAT_RETURN TEST_VOLATILE_GLOBAL; do
              rm -f rejected.o rejected.log
              if ../../../edgcpp-rust/target/debug/examples/codegen rejected.o --c++20 -D"$variant" codegen_rejected.cpp > rejected.log 2>&1; then
                echo "Unexpectedly accepted unsupported construct: $variant"
                exit 1
              fi
              grep -Eq 'parameter/return ABI must be|call callee is not a direct named routine|function-pointer calls unsupported|unsupported EDG operation|unsupported typed EDG expression|unsupported C expression type|unsupported/nonlocal variable|unresolved scalar variable|qualified global' rejected.log || {
                echo "Wrong rejection reason for $variant"
                cat rejected.log
                exit 1
              }
              test ! -e rejected.o
              echo "Rejected $variant"
            done
            rm -f rejected.o rejected.log
            if ../../../edgcpp-rust/target/debug/examples/codegen rejected.o --c11 --gcc m5_gnu_statement_expr.c > rejected.log 2>&1; then
              echo "Unexpectedly accepted GNU statement expression without block/value lowering"
              exit 1
            fi
            grep -E 'GNU block has unsupported statement kind|GNU statement-expression missing|GNU block statements after result' rejected.log
            test ! -e rejected.o
          )

      - name: Save incremental Rust cache (successful codegen-branch builds only)
        if: ${{ success() && github.ref == 'refs/heads/cranelift-codegen' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            edgcpp-rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
