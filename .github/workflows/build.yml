name: Rust EDG bridge (Linux x86-64)

# Only the default branch is verified on push. Pull requests get their own
# verification, avoiding duplicate push + PR builds on feature branches.
# Documentation-only updates do not compile C++/Rust.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - '**/*.md'
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch before they consume build CPU.
concurrency:
  group: edgcpp-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # Identical native toolchain to the published EDG x86-64 archive.
      image: ghcr.io/edgcpp/ci-runner@sha256:14b3948c2ce12cfa5472e5a6c468393d15426f3a67685cc35d830ea5db2acdf8
    defaults:
      run:
        shell: edg-container-exec "bash -eo pipefail {0}"
    env:
      # The versioned GitHub Release is built from exactly this EDG source.
      EDG_SOURCE_SHA: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
      EDG_RELEASE_TAG: edgcpfe-ci-799603e0b5ab
      # CI needs failures and diagnostics but not bulky debug symbols.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Check out Rust bindings
        uses: actions/checkout@v7
        with:
          path: edgcpp-rust

      - name: Check out exact EDG headers/configuration sources
        uses: actions/checkout@v7
        with:
          repository: bingundu/edgcpp
          ref: 799603e0b5ab272d9418e2d44a53a95bc73dfdc4
          path: edgcpp
          persist-credentials: false

      # GitHub's cache entries are immutable, so restore the newest matching
      # prior cache; only new main-branch builds save a replacement snapshot.
      - name: Restore Rust/Cargo incremental compilation cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            edgcpp-rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-edgcpp-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('edgcpp-rust/Cargo.toml', 'edgcpp-rust/Cargo.lock', 'edgcpp-rust/build.rs', 'edgcpp-rust/cpp/bridge.cpp', 'edgcpp-rust/tools/build_bridge.py') }}-${{ github.sha }}
          restore-keys: |
            rust-edgcpp-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('edgcpp-rust/Cargo.toml', 'edgcpp-rust/Cargo.lock', 'edgcpp-rust/build.rs', 'edgcpp-rust/cpp/bridge.cpp', 'edgcpp-rust/tools/build_bridge.py') }}-
            rust-edgcpp-v3-${{ runner.os }}-${{ runner.arch }}-

      # EDG's IL layout depends on compile-time macros. CMake configure is
      # cheap and generates matching compile_commands.json and environment.sh.
      # Do not build the native archive here; download its tested binary.
      - name: Configure metadata for EDG bridge compilation (no native build)
        env:
          EDG_BASE: ${{ github.workspace }}/edgcpp/bases/docker/dev-env/gcc
        working-directory: edgcpp
        run: |
          cmake --preset linux-gcc-release \
            -DEDG_BUILD_LIB=OFF \
            -DEDG_BUILD_CALLABLE_LIBRARY=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Download pinned, prebuilt EDG archive
        working-directory: edgcpp
        run: |
          set -euo pipefail
          url="https://github.com/bingundu/edgcpp/releases/download/$EDG_RELEASE_TAG/edgcpfe-ci-x86_64-callable-release-linux-x86_64.tar.gz"
          mkdir -p build/gcc-release/lib build/prebuilt-edg
          curl --fail --location --silent --show-error \
            --retry 4 --retry-delay 2 \
            "$url" --output build/prebuilt-edg/archive.tar.gz
          tar -xzf build/prebuilt-edg/archive.tar.gz -C build/prebuilt-edg
          grep -Fx "commit=$EDG_SOURCE_SHA" build/prebuilt-edg/BUILD-INFO.txt
          grep -Fx 'platform=linux-x86_64' build/prebuilt-edg/BUILD-INFO.txt
          test -s build/prebuilt-edg/lib/libedgcpfe.a
          cp build/prebuilt-edg/lib/libedgcpfe.a build/gcc-release/lib/libedgcpfe.a
          echo "Using prebuilt EDG $EDG_SOURCE_SHA; no EDG native compilation"

      - name: Install Rust toolchain
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add clippy

      - name: Build bindings and tests
        working-directory: edgcpp-rust
        env:
          EDGCPP_SOURCE_DIR: ${{ github.workspace }}/edgcpp
          EDGCPP_COMPILE_COMMANDS: ${{ github.workspace }}/edgcpp/build/gcc-release/compile_commands.json
          EDGCPP_LIB_DIR: ${{ github.workspace }}/edgcpp/build/gcc-release/lib
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --lib --tests
          cargo build --example parse
          cargo clippy --all-targets -- -D warnings
          cp tests/fixtures/namespaces.cpp ../edgcpp/build/gcc-release/il_fixture.cpp
          (
            cd ../edgcpp/build/gcc-release
            source environment.sh
            ../../../edgcpp-rust/target/debug/examples/parse --c++20 il_fixture.cpp > il_result.txt
            cat il_result.txt
            grep -F 'namespace outer' il_result.txt
            grep -F 'variable outer::count' il_result.txt
            grep -F 'routine outer::calculate, defined=true' il_result.txt
            grep -F 'routine control_flow_verification::branching, defined=true' il_result.txt
            grep -F 'routine control_flow_verification::ranged, defined=true' il_result.txt
            grep -F 'routine control_flow_verification::exception_handling, defined=true' il_result.txt
            grep -F 'statement control_flow_verification::branching path=' il_result.txt
            grep -F 'statement attributes control_flow_verification::branching path=' il_result.txt
            grep -E 'control expression control_flow_verification::branching statement=.*role=1 path=0 ' il_result.txt
            grep -F 'variable outer::inner::nested' il_result.txt
            grep -F 'statement outer::calculate path=' il_result.txt
            grep -F 'expression outer::calculate statement=' il_result.txt
            grep -F 'integer constant outer::calculate = 0' il_result.txt
            grep -F 'type id=' il_result.txt
            grep -F 'record field member offset=0 bit=0 width=0' il_result.txt
            grep -E 'record field flags offset=[0-9]+ bit=[0-9]+ width=3' il_result.txt
            grep -F 'reference=true rvalue=false' il_result.txt
            grep -F 'reference=true rvalue=true' il_result.txt
            grep -E 'function signature id=[0-9]+ prototyped=true variadic=true' il_result.txt
            # Declaration and initializer positions are distinct in lowered EDG.
            grep -E 'statement declaration declaration_site_verification::mixed path=.* position=0 name=declaration_site_verification::first symbol=[0-9]+ type=[0-9]+ vla=false' il_result.txt
            grep -E 'statement declaration declaration_site_verification::mixed path=.* position=1 name=declaration_site_verification::second symbol=[0-9]+ type=[0-9]+ vla=false' il_result.txt
            grep -E 'statement initialization declaration_site_verification::mixed path=.* name=Some\("declaration_site_verification::first"\).*role=0 ' il_result.txt
            grep -E 'statement initialization declaration_site_verification::mixed path=.* name=Some\("declaration_site_verification::second"\).*role=0 ' il_result.txt
            grep -E 'control expression declaration_site_verification::mixed statement=.* role=4 path=0 parent=None ' il_result.txt
            grep -E 'routine identity id=[0-9]+ function=declaration_site_verification::mixed' il_result.txt
            grep -E 'object lifetime routine=declaration_site_verification::mixed id=0 parent=None kind=[0-9]+' il_result.txt
            grep -E 'scope lifetime routine=declaration_site_verification::mixed scope=0 lifetime=0' il_result.txt
            grep -E 'lifetime destruction routine=declaration_site_verification::mixed lifetime=[0-9]+ position=0 variable=Some\(SymbolId\([0-9]+\)\) destructor=Some\(SymbolId\([0-9]+\)\)' il_result.txt
            grep -E 'statement source declaration_site_verification::mixed path=.*file=.*il_fixture.cpp line=[0-9]+ column=[0-9]+' il_result.txt
            grep -E 'symbol source id=[0-9]+ name=declaration_site_verification::(first|second).*file=.*il_fixture.cpp line=[0-9]+' il_result.txt
            grep -F 'routine outer::big_unsigned, defined=true' il_result.txt
            grep -F 'routine outer::overloaded(int), defined=true' il_result.txt
            grep -F 'routine outer::overloaded(long), defined=true' il_result.txt
            grep -F 'indexed symbols=' il_result.txt
            grep -E 'symbol type name=outer::count id=[0-9]+ type=[0-9]+' il_result.txt
            grep -E 'symbol type name=.*Derived::method id=[0-9]+ type=[0-9]+' il_result.txt
            grep -E 'function parameter routine=scope_verification::shadow.*position=Some\(0\).*type=[0-9]+ this=false' il_result.txt
            grep -E 'function parameter routine=scope_verification::shadow.*position=Some\(1\).*type=[0-9]+ this=false' il_result.txt
            grep -E 'function parameter routine=.*Receiver::read.*this=true' il_result.txt
            grep -E 'local scope routine=scope_verification::shadow id=0 parent=None' il_result.txt
            grep -E 'local variable routine=scope_verification::shadow scope=[0-9]+ name=.*value.*type=[0-9]+' il_result.txt
            grep -E 'static local owner routine=scope_verification::shadow name=.*calls symbol=[0-9]+' il_result.txt
            grep -E 'base class derived=[0-9]+ position=0 base=[0-9]+ virtual=false' il_result.txt
            grep -E 'base class derived=[0-9]+ position=1 base=[0-9]+ virtual=true' il_result.txt
            grep -E 'base access derived=[0-9]+ position=0 access=Some\([0-9]+\) pack=false' il_result.txt
            grep -E 'base access derived=[0-9]+ position=1 access=Some\([0-9]+\) pack=false' il_result.txt
            grep -E 'member function owner=[0-9]+ name=.*Derived::method' il_result.txt
            grep -E 'member function owner=[0-9]+ name=.*Derived::static_method' il_result.txt
            grep -E 'routine attributes name=.*Derived::virtual_method.*virtual=true override=true' il_result.txt
            # This EDG lowering configuration emits scalar member initializers
            # in the constructor body, not in constructor_inits. Validate the
            # resulting expression rather than requiring an optional event 23.
            grep -F 'expression cpp_bridge_verification::InitializerExpressionProbe::InitializerExpressionProbe(int) statement=' il_result.txt
            grep -E 'constructor initializer routine=.*Derived::Derived.*position=[0-9]+ kind=[0-3]' il_result.txt
            grep -F 'variable outer::constant_answer' il_result.txt
            grep -E 'initializer integer symbol=[0-9]+ value=42' il_result.txt
            grep -F 'variable outer::initialized_from_count' il_result.txt
            grep -E 'routine __sti_.*defined=true' il_result.txt
            grep -E 'reference __sti_.* -> outer::initialized_from_count' il_result.txt
            grep -F 'symbol reference ' il_result.txt
            grep -F 'statement outer::overloaded(int) path=' il_result.txt
            grep -F 'statement outer::overloaded(long) path=' il_result.txt
            if grep -F 'integer constant outer::big_unsigned' il_result.txt; then
              echo 'Unsigned constant was incorrectly converted to signed i64' >&2
              exit 1
            fi
          )

      - name: Save incremental Rust cache (successful main builds only)
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            edgcpp-rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
