name: M10 indirect-call baseline
# Automatic builds run on bingordo/compiler-ci, not in this source repo.
# Keep this workflow manually dispatchable for historical diagnostics.
on:
  workflow_dispatch:

concurrency:
  group: m10-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc-clang-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify GCC and Clang callback ABI baseline
        run: python3 tools/m10_indirect_baseline.py
